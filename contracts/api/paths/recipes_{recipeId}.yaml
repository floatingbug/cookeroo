get:
  tags:
    - Recipes
  operationId: getRecipe
  summary: Get a recipe by ID
  description: |
    Returns a recipe when it is public or belongs to the authenticated user.
    Private recipes of other users are reported as not found.
  security:
    - bearerAuth: []
  parameters:
    - name: recipeId
      in: path
      required: true
      description: MongoDB ObjectId of the recipe as a hex string.
      schema:
        type: string
        pattern: '^[a-f0-9]{24}$'
  responses:
    '200':
      description: The requested recipe.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Recipe.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
