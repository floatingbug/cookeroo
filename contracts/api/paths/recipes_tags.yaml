get:
  tags:
    - Recipes
  operationId: listRecipeTags
  summary: List available recipe tags
  description: |
    Returns the distinct tags of recipes that are public or belong to the
    authenticated user. Tags are deduplicated case-insensitively and sorted.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Available tags.
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
