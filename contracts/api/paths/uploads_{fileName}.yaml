get:
  tags:
    - Uploads
  operationId: getUploadedImage
  summary: Get an uploaded image
  description: Returns a previously uploaded image by file name.
  parameters:
    - name: fileName
      in: path
      required: true
      description: Generated file name of the uploaded image.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+\.(jpg|jpeg|png|webp)$'
  responses:
    '200':
      description: The image file.
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
