get:
  tags:
    - Recipes
  operationId: listPublicRecipes
  summary: List all public recipes
  description: |
    Returns all public recipes from all users, newest first. Private recipes are
    not included. The authenticated user's own public recipes are included as
    well.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: All public recipes.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Recipe.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
