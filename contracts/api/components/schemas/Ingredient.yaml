type: object
required:
  - name
  - quantity
  - unit
additionalProperties: false
description: An ingredient of a recipe.
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
  quantity:
    type: number
    exclusiveMinimum: 0
    description: Numeric amount of the ingredient.
  unit:
    $ref: IngredientUnit.yaml
  note:
    type:
      - string
      - 'null'
    maxLength: 300
  isOptional:
    type: boolean
    default: false
    description: Whether the ingredient is optional.
