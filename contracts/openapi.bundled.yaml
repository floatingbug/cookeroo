          content: *ref_12
        '404':
          description: The requested resource does not exist.
          content: *ref_23
        '500':
          description: Unexpected server error.
          content: *ref_4
  /uploads/images:
    post:
      tags:
        - Uploads
      operationId: uploadImage
      summary: Upload an image
      description: |
        Uploads a JPEG, PNG or WebP image and returns its public URL. The maximum
        file size is 5 MB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG or WebP, max 5 MB).
