                    type: object
                    required: *ref_25
                    additionalProperties: false
                    description: Owner or member of a meal planner.
                    properties: *ref_26
                  canEdit:
                    type: boolean
                    description: |
                      Whether the authenticated user may change this week. Always true for the
                      user's own planner and for members with edit permission.
        '400':
          description: Invalid input.
          content: *ref_2
        '401':
          description: Missing or invalid access token.
          content: *ref_12
        '404':
          description: The requested resource does not exist.
          content: *ref_24
        '500':
          description: Unexpected server error.
          content: *ref_4
    put:
      tags:
        - MealPlans
      operationId: saveMealPlan
      summary: Save the meal plan of a week
      description: |
        Replaces the complete meal plan of the week starting at `weekStart`.
        Without `ownerId` the authenticated user's own plan is saved. With
        `ownerId` the plan of a shared planner is saved when the authenticated
        user is a member with edit permission. Recipes must be public or belong to
        the authenticated user or the planner owner. An empty entry list clears
        the plan.
      security:
        - bearerAuth: []
      parameters:
        - name: weekStart
          in: path
          required: true
          description: Monday that starts the week, formatted as YYYY-MM-DD.
          schema:
            type: string
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: ownerId
          in: query
          required: false
          description: |
            ObjectId of the planner owner. Omit to save the authenticated user's
            own planner.
          schema:
            type: string
            pattern: ^[a-f0-9]{24}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_73
                - entries
              additionalProperties: false
              description: |
                Complete content of a week. Saving replaces all existing entries of the week,
                so an empty list clears the plan.
              properties: &ref_74
                entries:
                  type: array
                  maxItems: 21
                  description: Planned recipes. Each combination of day and meal may occur only once.
                  items:
                    type: object
                    required: &ref_71
