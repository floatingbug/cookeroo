openapi: 3.1.0
info:
  title: Fullstack Template API
  version: 1.0.0
  license:
    name: ISC
    identifier: ISC
  description: |
    HTTP API for authentication, users, account management, recipes
    and image uploads.

    All request and response bodies are JSON unless stated otherwise. Errors
    use `{ "message": "..." }`.

    Unknown routes return `404 { "message": "Not found" }`. Unexpected errors
    return `500 { "message": "Internal server error" }`.
servers:
  - url: http://localhost:3000
    description: Local development backend
tags:
  - name: Auth
    description: Registration, sign-in, sign-out, token refresh and email/password flows.
  - name: Users
    description: Current user and public user lookup.
  - name: Account
    description: Account updates and email-change confirmation.
  - name: Recipes
    description: Create, view and delete recipes.
  - name: MealPlans
    description: Weekly meal planning with recipes.
  - name: Uploads
    description: Image uploads and delivery.
paths:
  /auth/sign-up:
    post:
      tags:
        - Auth
      operationId: signUp
      security: []
      summary: Create an account
      description: |
        Creates a user and sends a verification email. In development without
        SMTP configuration the verification link is written to the backend log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_37
                - name
                - email
                - password
              additionalProperties: true
              properties: &ref_38
                name:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: ^[a-zA-Z0-9._-]+$
                  description: Trimmed display name.
                email:
                  type: string
                  description: Email address; normalized to lowercase.
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: |
                    Must contain uppercase and lowercase letters and at least one
                    number. Never trimmed.
      responses:
        '201':
          description: Account created; verification email requested.
          content:
            application/json:
              schema:
                type: object
                required: &ref_6
                  - message
                additionalProperties: false
                properties: &ref_7
                  message:
                    type: string
        '400':
          description: Invalid input.
          content: &ref_2
            application/json:
              schema:
                type: object
                required: &ref_0
                  - message
                additionalProperties: false
                properties: &ref_1
                  message:
                    type: string
        '409':
          description: Name or email address is already in use.
          content:
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
        '429':
          description: Rate limit exceeded (only active in production).
          content: &ref_3
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
        '500':
          description: Unexpected server error.
          content: &ref_4
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
        '502':
          description: The verification email could not be sent.
          content:
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
  /auth/sign-in:
    post:
      tags:
        - Auth
      operationId: signIn
      security: []
      summary: Sign in
      description: |
        Returns an access token in the JSON body and sets the HttpOnly refresh
        token cookie. The refresh token is never returned in the JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_39
                - nameOrEmail
                - password
              additionalProperties: true
              properties: &ref_40
                nameOrEmail:
                  type: string
                  description: Email address or display name.
                password:
                  type: string
      responses:
        '200':
          description: Signed in successfully.
          headers:
            Set-Cookie:
              description: |
                Cookie header for the refresh token. Sign-in sets it; sign-out clears it.
              schema: &ref_5
                type: string
          content:
            application/json:
              schema:
                type: object
                required: &ref_41
                  - user
                  - accessToken
                additionalProperties: false
                properties: &ref_42
                  user:
                    type: object
                    required: &ref_10
                      - id
                      - name
                      - email
                    additionalProperties: false
                    description: |
                      Public user data. `name` and `email` are personal data.
                    properties: &ref_11
                      id:
                        type: string
                        description: MongoDB ObjectId serialized as a hex string.
                      name:
                        type: string
                        minLength: 3
                        maxLength: 50
                      email:
                        type: string
                        description: Normalized email address.
                  accessToken:
                    type: string
                    description: 'JWT access token for the `Authorization: Bearer` header.'
        '400':
          description: Invalid input.
          content: *ref_2
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
        '403':
          description: The email address has not been verified yet.
          content:
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
  /auth/sign-out:
    post:
      tags:
        - Auth
      operationId: signOut
      summary: Sign out
      description: |
        Requires a valid access token and clears the refresh token cookie.
        The response has no body.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Signed out; refresh cookie cleared.
          headers:
            Set-Cookie:
              description: |
                Cookie header for the refresh token. Sign-in sets it; sign-out clears it.
              schema: *ref_5
        '401':
          description: Missing or invalid access token.
          content: &ref_12
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshAccessToken
      summary: Refresh the access token
      description: |
        Reads the HttpOnly `refreshToken` cookie and returns a new access token.
        The refresh cookie is not rotated.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                type: object
                required: &ref_43
                  - accessToken
                additionalProperties: false
                properties: &ref_44
                  accessToken:
                    type: string
        '401':
          description: Refresh token missing, invalid or expired.
          content:
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
  /auth/verify-email:
    get:
      tags:
        - Auth
      operationId: verifyEmail
      security: []
      summary: Verify an email address
      description: |
        Verifies the email address using the token from the verification email.
        Opening the same valid link again returns 200 if the address is already
        verified.
      parameters:
        - name: token
          in: query
          required: false
          description: |
            Token from the email link. Required in practice; if missing, the
            endpoint responds with 400.
          schema: &ref_13
            type: string
      responses:
        '200':
          description: Email address verified (or already verified).
          content:
            application/json:
              schema:
                type: object
                required: *ref_6
                additionalProperties: false
                properties: *ref_7
        '400':
          description: Invalid input.
          content: *ref_2
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
  /auth/verify-email/resend:
    post:
      tags:
        - Auth
      operationId: resendVerificationEmail
      security: []
      summary: Resend the verification email
      description: |
        Always responds generically so the endpoint does not reveal whether an
        account exists. A mail delivery failure returns 502.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_8
                - email
              additionalProperties: true
              properties: &ref_9
                email:
                  type: string
      responses:
        '200':
          description: Request accepted; a verification email was sent if applicable.
          content:
            application/json:
              schema:
                type: object
                required: *ref_6
                additionalProperties: false
                properties: *ref_7
        '400':
          description: Invalid input.
          content: *ref_2
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
        '502':
          description: The verification email could not be sent.
          content:
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
  /auth/forgot-password:
    post:
      tags:
        - Auth
      operationId: forgotPassword
      security: []
      summary: Request a password reset
      description: |
        Always responds generically so the endpoint does not reveal whether an
        account exists. Mail errors are logged and do not change the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: *ref_8
              additionalProperties: true
              properties: *ref_9
      responses:
        '200':
          description: Request accepted; a reset link was sent if applicable.
          content:
            application/json:
              schema:
                type: object
                required: *ref_6
                additionalProperties: false
                properties: *ref_7
        '400':
          description: Invalid input.
          content: *ref_2
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
  /auth/reset-password:
    post:
      tags:
        - Auth
      operationId: resetPassword
      security: []
      summary: Set a new password
      description: |
        Consumes the password reset token and replaces the password. Passwords
        are never trimmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_45
                - token
                - password
              additionalProperties: true
              properties: &ref_46
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: |
                    Must contain uppercase and lowercase letters and at least one
                    number. Never trimmed.
      responses:
        '200':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                type: object
                required: *ref_6
                additionalProperties: false
                properties: *ref_7
        '400':
          description: Invalid input.
          content: *ref_2
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
  /users/me:
    get:
      tags:
        - Users
      operationId: getCurrentUser
      summary: Get the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                required: *ref_10
                additionalProperties: false
                description: |
                  Public user data. `name` and `email` are personal data.
                properties: *ref_11
        '401':
          description: Missing or invalid access token.
          content: *ref_12
        '404':
          description: The authenticated user no longer exists.
          content:
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
    delete:
      tags:
        - Users
      operationId: deleteCurrentUser
      summary: Delete the current account
      description: Deletes the account and clears the refresh token cookie.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted.
          content:
            application/json:
              schema:
                type: object
                required: *ref_6
                additionalProperties: false
                properties: *ref_7
        '401':
          description: Missing or invalid access token.
          content: *ref_12
        '404':
          description: The account could not be deleted because it no longer exists.
          content:
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
  /account:
    patch:
      tags:
        - Account
      operationId: updateAccount
      summary: Update name, email or password
      description: |
        Changes one or more fields. Business conflicts such as a taken name or
        email, an identical value, or an identical email are intentionally
        reported in the `errorMessages` object with HTTP 200. Multiple fields
        can succeed or fail independently in a single request. Input validation
        failures use HTTP 400 with `{ "message": ... }`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              description: |
                At least one of `name`, `email` or `password` is required. Unknown
                fields are rejected by the existing account validation middleware.
              properties: &ref_47
                name:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: ^[a-zA-Z0-9._-]+$
                email:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: |
                    Must contain uppercase and lowercase letters and at least one
                    number. Never trimmed.
      responses:
        '200':
          description: |
            Update processed. Successful fields are listed in `messages` and
            `updated`; business conflicts are intentionally reported in
            `errorMessages` with HTTP 200. Multiple fields can succeed or fail
            independently.
          content:
            application/json:
              schema:
                type: object
                description: |
                  Result of a partially successful account update. `messages` contains
                  successful fields, `errorMessages` contains business conflicts, and
                  `updated` lists the fields that were changed.
                required: &ref_48
                  - messages
                  - errorMessages
                  - updated
                additionalProperties: false
                properties: &ref_49
                  messages:
                    type: object
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                      password:
                        type: string
                  errorMessages:
                    type: object
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                      password:
                        type: string
                  updated:
                    type: array
                    items:
                      type: string
                      enum:
                        - name
                        - email
                        - password
        '400':
          description: Invalid input.
          content: *ref_2
        '401':
          description: Missing or invalid access token.
          content: *ref_12
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
  /account/confirm-email:
    get:
      tags:
        - Account
      operationId: confirmEmailChange
      security: []
      summary: Confirm an email change
      description: |
        Confirms a pending email change using the token from the confirmation
        email. The endpoint itself does not require authentication.
      parameters:
        - name: token
          in: query
          required: false
          description: |
            Token from the email link. Required in practice; if missing, the
            endpoint responds with 400.
          schema: *ref_13
      responses:
        '200':
          description: Email address changed.
          content:
            application/json:
              schema:
                type: object
                required: &ref_50
                  - success
                  - newEmail
                  - message
                additionalProperties: false
                properties: &ref_51
                  success:
                    type: boolean
                    enum:
                      - true
                  newEmail:
                    type:
                      - string
                      - 'null'
                  message:
                    type: string
        '400':
          description: Invalid input.
          content: *ref_2
        '409':
          description: The new email address is already in use by another account.
          content:
            application/json:
              schema:
                type: object
                required: *ref_0
                additionalProperties: false
                properties: *ref_1
        '429':
          description: Rate limit exceeded (only active in production).
          content: *ref_3
        '500':
          description: Unexpected server error.
          content: *ref_4
  /recipes:
    get:
      tags:
        - Recipes
      operationId: listRecipes
      summary: List recipes created by the authenticated user
      description: |
        Returns all recipes created by the authenticated user, including private
        recipes, newest first. Recipes created by other users are not included.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recipes created by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: &ref_21
                    - id
                    - title
                    - description
                    - imageUrl
                    - category
                    - cuisine
                    - difficulty
                    - prepTime
                    - cookTime
                    - restTime
                    - servings
                    - servingUnit
                    - tags
                    - ingredients
                    - instructions
                    - createdAt
                    - updatedAt
                    - createdBy
                    - isPublic
                    - status
                  additionalProperties: false
                  description: A complete recipe after creation or lookup.
                  properties: &ref_22
                    id:
                      type: string
                      description: MongoDB ObjectId serialized as a hex string.
                    title:
                      type: string
                      minLength: 1
                      maxLength: 150
                    description:
                      type:
                        - string
                        - 'null'
                    imageUrl:
                      type:
                        - string
                        - 'null'
                      format: uri
                    category:
                      type:
                        - string
                        - 'null'
                    cuisine:
                      type:
                        - string
                        - 'null'
                    difficulty:
                      oneOf:
                        - type: string
                          description: Difficulty of a recipe.
                          enum: &ref_16
                            - easy
                            - medium
                            - hard
                        - type: 'null'
                    prepTime:
                      type: integer
                      minimum: 0
                    cookTime:
                      type: integer
                      minimum: 0
                    restTime:
                      type:
                        - integer
                        - 'null'
                    servings:
                      type: integer
                      minimum: 1
                    servingUnit:
                      type:
                        - string
                        - 'null'
                    tags:
                      type: array
                      items:
                        type: string
                    ingredients:
                      type: array
                      items:
                        type: object
                        required: &ref_17
                          - name
                          - quantity
                          - unit
                        additionalProperties: false
                        description: An ingredient of a recipe.
                        properties: &ref_18
                          name:
                            type: string
                            minLength: 1
                            maxLength: 120
                          quantity:
                            type: number
                            exclusiveMinimum: 0
                            description: Numeric amount of the ingredient.
                          unit:
                            type: string
                            description: Unit of an ingredient quantity.
                            enum: &ref_52
                              - g
                              - kg
                              - ml
                              - l
                              - piece
                              - tbsp
                              - tsp
                          note:
                            type:
                              - string
                              - 'null'
                            maxLength: 300
                          isOptional:
                            type: boolean
                            default: false
                            description: Whether the ingredient is optional.
                    instructions:
                      type: array
                      items:
                        type: object
                        required: &ref_19
                          - step
                          - description
                        additionalProperties: false
                        description: A single preparation step of a recipe.
                        properties: &ref_20
                          step:
                            type: integer
                            minimum: 1
                            description: 1-based position of the step.
                          description:
                            type: string
                            minLength: 1
                            maxLength: 2000
                          duration:
                            type:
                              - integer
                              - 'null'
                            minimum: 0
                            description: Duration in minutes.
                          imageUrl:
                            type:
                              - string
                              - 'null'
                            format: uri
                            description: URL of an uploaded image for this step.
                    nutrition:
                      oneOf:
                        - type: object
                          required: &ref_53
                            - total
                            - perServing
                            - matchedIngredients
                            - totalIngredients
                            - unmatchedIngredients
                          additionalProperties: false
                          description: |
                            Nutrients calculated on the server from the foods collection. Only ingredients
                            that could be matched to a food and converted to grams are included. Optional
                            ingredients are included as well.
                          properties: &ref_54
                            total:
                              type: object
                              required: &ref_14
                                - calories
                                - protein
                                - fat
                                - carbohydrates
                                - fiber
                                - sugar
                                - salt
                              additionalProperties: false
                              description: Nutrient values calculated from the recipe ingredients.
                              properties: &ref_15
                                calories:
                                  type: number
                                  minimum: 0
                                  description: Energy in kilocalories (kcal).
                                protein:
                                  type: number
                                  minimum: 0
                                  description: Protein in grams.
                                fat:
                                  type: number
                                  minimum: 0
                                  description: Fat in grams.
                                carbohydrates:
                                  type: number
                                  minimum: 0
                                  description: Available carbohydrates in grams.
                                fiber:
                                  type: number
                                  minimum: 0
                                  description: Total dietary fiber in grams.
                                sugar:
                                  type: number
                                  minimum: 0
                                  description: Total mono- and disaccharides in grams.
                                salt:
                                  type: number
                                  minimum: 0
                                  description: Salt (sodium chloride) in grams.
                            perServing:
                              type: object
                              required: *ref_14
                              additionalProperties: false
                              description: Nutrient values calculated from the recipe ingredients.
                              properties: *ref_15
                            matchedIngredients:
                              type: integer
                              minimum: 0
                              description: Number of ingredients included in the calculation.
                            totalIngredients:
                              type: integer
                              minimum: 1
                              description: Total number of ingredients in the recipe.
                            unmatchedIngredients:
                              type: array
                              description: Names of ingredients that were not included in the calculation.
                              items:
                                type: string
                        - type: 'null'
                      description: |
                        Nutrients calculated by the server from the foods collection. Null when no
                        ingredient could be matched and converted to grams. Older recipes may not
                        contain this field.
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    createdBy:
                      type: string
                      description: MongoDB ObjectId of the creating user as a hex string.
                    isPublic:
                      type: boolean
                    status:
                      type: string
                      description: |
                        Visibility of a recipe. Derived from `isPublic`: `public` when the recipe is
                        visible to other users, `private` otherwise.
                      enum: &ref_23
                        - public
                        - private
        '401':
          description: Missing or invalid access token.
          content: *ref_12
        '500':
          description: Unexpected server error.
          content: *ref_4
    post:
      tags:
        - Recipes
      operationId: createRecipe
      summary: Create a recipe
      description: Creates a recipe for the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: &ref_55
                - title
                - prepTime
                - cookTime
                - servings
                - ingredients
                - instructions
              additionalProperties: false
              description: |
                Payload to create a recipe. Timestamps, creator and status are derived by the
                server and cannot be supplied by the client.
              properties: &ref_56
                title:
                  type: string
                  minLength: 1
                  maxLength: 150
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 2000
                imageUrl:
                  type:
                    - string
                    - 'null'
                  format: uri
                  description: URL of an uploaded image for the recipe.
                category:
                  type:
                    - string
                    - 'null'
                  maxLength: 60
                cuisine:
                  type:
                    - string
                    - 'null'
                  maxLength: 60
                difficulty:
                  oneOf:
                    - type: string
                      description: Difficulty of a recipe.
                      enum: *ref_16
                    - type: 'null'
                prepTime:
                  type: integer
                  minimum: 0
                  description: Preparation time in minutes.
                cookTime:
                  type: integer
                  minimum: 0
                  description: Cooking time in minutes.
                restTime:
                  type:
                    - integer
                    - 'null'
                  minimum: 0
                  description: Resting time in minutes.
                servings:
                  type: integer
                  minimum: 1
                servingUnit:
                  type:
                    - string
                    - 'null'
                  maxLength: 40
                  description: Optional label of one serving, for example "Portion".
                tags:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 30
