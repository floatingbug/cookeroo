      operationId: getUploadedImage
      summary: Get an uploaded image
      description: Returns a previously uploaded image by file name.
      parameters:
        - name: fileName
          in: path
          required: true
          description: Generated file name of the uploaded image.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]+\.(jpg|jpeg|png|webp)$
      responses:
        '200':
          description: The image file.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: The requested resource does not exist.
          content: *ref_23
        '500':
          description: Unexpected server error.
          content: *ref_4
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /auth/sign-in` or `POST /auth/refresh`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: |
        HttpOnly refresh token cookie. Path `/auth/refresh`; `SameSite=Lax` in
        development and `SameSite=None; Secure` in production.
  schemas:
    SignUpRequest:
      type: object
      required: *ref_24
      additionalProperties: true
      properties: *ref_25
    Message:
      type: object
      required: *ref_6
      additionalProperties: false
      properties: *ref_7
    Error:
      type: object
      required: *ref_0
      additionalProperties: false
      properties: *ref_1
    SignInRequest:
      type: object
      required: *ref_26
      additionalProperties: true
      properties: *ref_27
    User:
      type: object
      required: *ref_10
      additionalProperties: false
      description: |
        Public user data. `name` and `email` are personal data.
      properties: *ref_11
    SignInResponse:
      type: object
      required: *ref_28
      additionalProperties: false
      properties: *ref_29
    RefreshResponse:
      type: object
      required: *ref_30
      additionalProperties: false
      properties: *ref_31
    EmailRequest:
      type: object
      required: *ref_8
      additionalProperties: true
      properties: *ref_9
    ResetPasswordRequest:
      type: object
      required: *ref_32
      additionalProperties: true
      properties: *ref_33
    AccountUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: |
        At least one of `name`, `email` or `password` is required. Unknown
        fields are rejected by the existing account validation middleware.
      properties: *ref_34
    AccountUpdateResult:
      type: object
      description: |
        Result of a partially successful account update. `messages` contains
        successful fields, `errorMessages` contains business conflicts, and
        `updated` lists the fields that were changed.
