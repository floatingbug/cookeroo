  /recipes/{recipeId}:
    get:
      tags:
        - Recipes
      operationId: getRecipe
      summary: Get a recipe by ID
      description: |
        Returns a recipe when it is public or belongs to the authenticated user.
        Private recipes of other users are reported as not found.
      security:
        - bearerAuth: []
      parameters:
        - name: recipeId
          in: path
          required: true
          description: MongoDB ObjectId of the recipe as a hex string.
          schema:
            type: string
            pattern: ^[a-f0-9]{24}$
      responses:
        '200':
          description: The requested recipe.
          content:
            application/json:
              schema:
                type: object
                required: *ref_21
                additionalProperties: false
                description: A complete recipe after creation or lookup.
