        - MealPlans
      operationId: getMealPlan
      summary: Get the meal plan of a week
      description: |
        Returns a meal plan for the week starting at `weekStart`. Without
        `ownerId` the authenticated user's own plan is returned. With `ownerId`
        the plan of a shared planner is returned when the authenticated user is a
        member; otherwise the planner is reported as not found. A week without a
        saved plan is returned with an empty entry list and `updatedAt` set to null.
      security:
        - bearerAuth: []
      parameters:
        - name: weekStart
          in: path
          required: true
          description: Monday that starts the week, formatted as YYYY-MM-DD.
          schema:
            type: string
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: ownerId
          in: query
          required: false
          description: |
            ObjectId of the planner owner. Omit to load the authenticated user's
            own planner.
          schema:
            type: string
            pattern: ^[a-f0-9]{24}$
      responses:
        '200':
          description: The meal plan of the requested week.
          content:
            application/json:
              schema:
                type: object
                required: &ref_35
                  - weekStart
                  - entries
                  - updatedAt
                  - owner
                  - canEdit
                additionalProperties: false
                description: The meal plan of one Monday-to-Sunday week.
                properties: &ref_36
                  weekStart:
                    type: string
                    format: date
                    description: Monday that starts the week, formatted as YYYY-MM-DD.
                  entries:
                    type: array
                    maxItems: 21
                    items:
                      type: object
                      required: &ref_69
                        - day
                        - meal
                        - recipeId
                        - recipe
                      additionalProperties: false
                      description: One planned recipe including its current recipe summary.
                      properties: &ref_70
                        day:
                          type: string
                          description: A weekday within a Monday-to-Sunday meal plan.
                          enum: &ref_33
                            - monday
                            - tuesday
                            - wednesday
                            - thursday
                            - friday
                            - saturday
                            - sunday
                        meal:
                          type: string
                          description: The meal slot within a day of a meal plan.
                          enum: &ref_34
                            - breakfast
                            - lunch
                            - dinner
                        recipeId:
                          type: string
                          description: MongoDB ObjectId of the planned recipe as a hex string.
                          pattern: ^[a-f0-9]{24}$
                        recipe:
                          oneOf:
                            - type: object
                              required: *ref_31
                              additionalProperties: false
                              description: Compact recipe representation used by search results and meal plans.
                              properties: *ref_32
                            - type: 'null'
                          description: Current recipe data, or null when the recipe is no longer accessible.
